<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 相对路径：vite.config 的 base 是 './'（GitHub Pages 子路径部署），写 '/favicon.ico' 会在子路径下 404 -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <title>NIKKE Photos</title>
    <script>
      // 首屏前应用主题，避免深色用户看到一瞬浅色（key 与 src/lib/theme.js 保持一致）
      ;(function () {
        try {
          var saved = localStorage.getItem('nikke-photos:theme')
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
      // 首屏前应用语言，避免繁体用户看到一瞬简体（key 与 src/lib/i18n.js 保持一致）
      ;(function () {
        function pickLang() {
          var query = window.location.search || ''
          var hash = window.location.hash || ''
          var hashQuery = hash.indexOf('?') >= 0 ? hash.slice(hash.indexOf('?') + 1) : ''
          var values = []
          try { values.push(new URLSearchParams(query).get('lang')) } catch (error) { /* 忽略 */ }
          try { values.push(new URLSearchParams(hashQuery).get('lang')) } catch (error) { /* 忽略 */ }
          for (var i = 0; i < values.length; i += 1) {
            var value = String(values[i] || '').toLowerCase()
            if (value === 'zh-hant' || value === 'tw' || value === 'hant') return 'zh-Hant'
            if (value === 'zh-hans' || value === 'cn' || value === 'hans') return 'zh-Hans'
          }
          var saved = localStorage.getItem('nikke-photos:locale')
          if (saved === 'zh-Hant' || saved === 'zh-Hans') return saved
          var langs = navigator.languages || [navigator.language]
          for (var j = 0; j < langs.length; j += 1) {
            var lang = String(langs[j] || '').toLowerCase()
            if (lang === 'zh-tw' || lang === 'zh-hk' || lang === 'zh-mo' || lang === 'zh-hant') return 'zh-Hant'
            if (lang.indexOf('zh') === 0) return 'zh-Hans'
          }
          return 'zh-Hans'
        }
        var locale
        try {
          locale = pickLang()
        } catch (error) {
          locale = 'zh-Hans'
        }
        document.documentElement.setAttribute('data-locale', locale)
        document.documentElement.lang = locale === 'zh-Hant' ? 'zh-Hant' : 'zh-CN'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
